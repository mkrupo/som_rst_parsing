[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "som-rst-parsing"
version = "0.1.0"
description = "A minimal TypeSafe Jev experiment for RST relation and nuclearity classification"
requires-python = ">=3.11,<3.12"
dependencies = ["typesafe-sdk==0.7.1"]

[tool.setuptools]
packages = ["src"]
